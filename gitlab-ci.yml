# Match the SDK: GitHub sees refs only after test, publication, and
# the GitLab release succeed.
stages:
  - test
  - release
  - announce
  - mirror

variables:
  GITHUB_MIRROR_REPO: rodrigopitanga/pavedb-client-js

.stable-tag: &stable-tag
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

mirror-github:
  image: alpine:3.20
  stage: mirror
  before_script:
    - apk add --no-cache git
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
    - git remote remove github-mirror 2>/dev/null || true
    - |
      github_url="https://x-access-token:${GITHUB_MIRROR_TOKEN}"
      github_url="${github_url}@github.com/${GITHUB_MIRROR_REPO}.git"
      git remote add github-mirror "$github_url"
    - |
      main_ref="+refs/heads/${CI_DEFAULT_BRANCH}:"
      main_ref="${main_ref}refs/remotes/origin/${CI_DEFAULT_BRANCH}"
      git fetch origin "$main_ref" "+refs/tags/*:refs/tags/*"
    - |
      main_dst="refs/remotes/origin/${CI_DEFAULT_BRANCH}:"
      main_dst="${main_dst}refs/heads/${CI_DEFAULT_BRANCH}"
      git push github-mirror "$main_dst"
    - git push github-mirror "refs/tags/*:refs/tags/*"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'

node:
  image: node:22-alpine
  stage: test
  before_script:
    - apk add --no-cache bash make git
  script:
    - npm ci
    - make test
    - make docs-check
    - make release-tarball-check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'
    - if: '$CI_COMMIT_TAG'

release-tarball:
  image: node:22-alpine
  stage: test
  before_script:
    - apk add --no-cache bash make git
  script:
    - npm ci
    - test -z "${CI_COMMIT_TAG:-}" || make release-tag-check
    - make release-tarball-check
  artifacts:
    paths:
      - dist/*.tgz
      - docs/reference/api.md
    expire_in: never
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/'
    - if: >-
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $NPMJS_PUBLISH == "true"

publish-npm:
  image: node:22-alpine
  stage: release
  needs:
    - job: release-tarball
      artifacts: true
  script:
    # publish from a git-free dir: npm must not introspect the checkout
    - mkdir -p /tmp/pub && cp dist/flowlexi-pavedb-client-*.tgz /tmp/pub/
    - |
      {
        echo "@flowlexi:registry=https://gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/"
        echo "//gitlab.com/api/v4/projects/${CI_PROJECT_ID}/packages/npm/:_authToken=${CI_JOB_TOKEN}"
      } > /tmp/pub/.npmrc
    - cd /tmp/pub && npm publish flowlexi-pavedb-client-*.tgz --userconfig .npmrc
  <<: *stable-tag

publish-npmjs:
  # The protected token is available only to protected tags and main.
  image: node:22-alpine
  stage: release
  needs:
    - job: release-tarball
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{1,4}\.\d{1,4}\.\d{1,4}$/ && $NPM_TOKEN'
    - if: >-
        $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH &&
        $NPMJS_PUBLISH == "true" && $NPM_TOKEN
      when: manual
  script:
    - mkdir -p /tmp/pub && cp dist/flowlexi-pavedb-client-*.tgz /tmp/pub/
    - |
      {
        echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}"
      } > /tmp/pub/.npmrc
    - |
      cd /tmp/pub
      npm publish flowlexi-pavedb-client-*.tgz \
        --access public \
        --registry https://registry.npmjs.org \
        --userconfig .npmrc

release-notes:
  image: alpine:3.20
  stage: release
  script:
    - |
      version="${CI_COMMIT_TAG#v}"
      pattern="$(printf '%s' "$version" | sed 's/[].[^$*\\]/\\&/g')"
      awk -v pattern="$pattern" '
        $0 ~ "^## " pattern "([ \t]|$)" { found = 1; next }
        found && /^## / { exit }
        found && /^---$/ { exit }
        found && !started && NF { started = 1 }
        found && started { print }
        END { if (!found || !started) exit 1 }
      ' CHANGELOG.md > release-notes.md
      test -s release-notes.md
      printf 'PaveDB JavaScript / TypeScript Client %s\n' "$version" \
        > release-title.txt
  artifacts:
    paths:
      - release-notes.md
      - release-title.txt
  <<: *stable-tag

announce-gitlab:
  image: registry.gitlab.com/gitlab-org/cli:latest
  stage: announce
  variables:
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  needs:
    - job: publish-npm
    - job: publish-npmjs
    - job: release-notes
      artifacts: true
  script:
    - |
      glab release create "$CI_COMMIT_TAG" --name "$(cat release-title.txt)" \
        --notes-file release-notes.md --ref "$CI_COMMIT_SHA"
  <<: *stable-tag

announce-github:
  image: alpine:3.20
  stage: mirror
  needs:
    - job: mirror-github
    - job: announce-gitlab
      artifacts: false
    - job: publish-npm
    - job: publish-npmjs
    - job: release-notes
      artifacts: true
  before_script:
    - apk add --no-cache git github-cli
  script:
    - |
      test -n "${GITHUB_MIRROR_TOKEN:-}" || {
        echo "GITHUB_MIRROR_TOKEN is missing"
        exit 1
      }
      export GH_TOKEN="$GITHUB_MIRROR_TOKEN"
    - |
      git ls-remote --exit-code \
        "https://github.com/${GITHUB_MIRROR_REPO}.git" \
        "refs/tags/${CI_COMMIT_TAG}"
    - |
      if gh release view "$CI_COMMIT_TAG" \
        --repo "$GITHUB_MIRROR_REPO" >/dev/null 2>&1; then
        gh release edit "$CI_COMMIT_TAG" \
          --repo "$GITHUB_MIRROR_REPO" \
          --title "$(cat release-title.txt)" --notes-file release-notes.md
      else
        gh release create "$CI_COMMIT_TAG" \
          --repo "$GITHUB_MIRROR_REPO" --verify-tag \
          --title "$(cat release-title.txt)" --notes-file release-notes.md
      fi
  <<: *stable-tag
